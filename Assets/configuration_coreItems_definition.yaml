#Options for core system configuration
- name          : name
  description   : Name of the your SOC design
  type          : OpenString
  defaultValue  : "new_soc_design"
  access        : True
  
- name          : cpu_type
  description   : CPU type
  type          : OptionList
  defaultValue  : "vexriscv"
  options       : ["vexriscv", "picorv32", "lm32", "mor1kx", "rocket", "blackparrot", "neorv32", "kianv"]
  access        : True  
  
- name          : compile_software
  description   : Compile Software 
  type          : Boolean
  defaultValue  : True
  access        : True  
  
- name          : sys_clk_freq
  description   : System clock frequency
  type          : Integer
  defaultValue  : 60e6
  access        : True

- name          : bus_standard
  description   : Bus standard
  type          : OptionList
  defaultValue  : "wishbone"
  options       : ["wishbone", "axi", "axi-lite"]
  access        : True

- name          : bus_interconnect
  description   : Bus interconnect
  type          : OptionList
  defaultValue  : "shared"
  options       : ["shared", "crossbar"]
  access        : True

- name          : bus_data_width
  description   : Bus data width in bits
  type          : OptionList
  defaultValue  : 32
  options       : [32, 64, 128, 256, 512]
  access        : True

- name          : bus_address_width
  description   : Bus address width in bits
  type          : Integer
  defaultValue  : 32
  access        : True

- name          : bus_timeout
  description   : Bus timeout in cycles
  type          : Integer
  defaultValue  : 1000000
  access        : True

- name          : bus_bursting
  description   : Bus bursting
  type          : Boolean
  defaultValue  : False
  access        : True

- name          : integrated_rom_size
  description   : Integrated ROM size in bytes
  type          : Integer
  defaultValue  : 131072
  access        : True

- name          : integrated_sram_size
  description   : Integrated SRAM size in bytes
  type          : Integer
  defaultValue  : 8192
  access        : True
  
- name          : integrated_main_ram_size
  description   : Integrated main RAM size in bytes
  type          : Integer
  defaultValue  : 8192
  access        : True

#BIOS settings  
- name          : bios_format
  description   : Format of the bios
  type          : OpenString
  defaultValue  : "integer"
  access        : True

- name          : bios_console
  description   : Console of the bios
  type          : OpenString
  defaultValue  : "full"
  access        : True  

- name          : bios_lto
  description   : Use link time optimization for the bios
  type          : Boolean
  defaultValue  : False
  access        : True
  
- name          : no_ident_version
  description   : Disable identification version
  type          : Boolean
  defaultValue  : False
  access        : True

- name          : no_ctrl
  description   : Disable control
  type          : Boolean
  defaultValue  : False
  access        : True
  
- name          : doc
  description   : Generate documentation
  type          : Boolean
  defaultValue  : True
  access        : True  
  
